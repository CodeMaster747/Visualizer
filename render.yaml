# Render blueprint: the whole stack as one free web service.
#
# Free instances are 512 MB / 0.1 vCPU and spin down after 15 minutes idle, so
# the first request after a quiet spell pays a cold start. Everything the
# compose deployment splits across five containers runs here as one process
# table -- see infra/render/Dockerfile and infra/render/README.md.

services:
  - type: web
    name: visualizer
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./infra/render/Dockerfile
    # The Dockerfile copies from frontend/, backend/, tracer-*/ so it needs the
    # repository root as its context, not the directory it lives in.
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      # Declare the port rather than leaving Render to scan for it. Render pins
      # the first port it detects, and an earlier revision of this service
      # exposed the backend on 8080 -- so it kept probing
      # <service>:8080/api/health and failing the deploy long after the backend
      # moved to loopback. Caddy is the only public listener and it is here.
      - key: PORT
        value: "10000"
      # Set in the Render dashboard; never commit the key.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # --- Accounts --------------------------------------------------------
      # Signs the access tokens the API issues. `generateValue` has Render mint
      # a random one on first deploy and keep it across every later deploy,
      # which is exactly the property this needs: the app would otherwise
      # generate its own into a container filesystem that each deploy replaces,
      # signing every user out on release day.
      #
      # There is no matching frontend variable, and that is deliberate. The SPA
      # discovers nothing about authentication at build time, so this cannot be
      # set on one side only -- the failure that made a signed-in user watch
      # every request 401 with no way to recover.
      - key: VISUALIZER_AUTH_SECRET
        generateValue: true

      # --- Azure, optional -------------------------------------------------
      # `sync: false`, so the service deploys and runs with it unset -- which is
      # exactly the deployment that exists today. Fill it in the dashboard to
      # switch the feature on. See infra/azure/README.md for where the value
      # comes from.
      #
      # Durable trace storage. Without it this free instance loses every trace
      # each time it spins down, which it does after 15 minutes idle.
      - key: AZURE_STORAGE_CONNECTION_STRING
        sync: false
      - key: AZURE_STORAGE_CONTAINER
        value: traces
