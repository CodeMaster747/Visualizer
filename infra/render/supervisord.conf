; Process table for the single-container build.
;
; The compose deployment gives each service its own container, its own memory
; limit and its own network. A 512 MB free host has room for exactly one
; container, so the same five processes run here side by side under supervisor
; and talk over loopback instead of a Docker network.
;
; Every heap is capped explicitly. Left to themselves both JVMs size their heap
; from *total container* memory and would each claim a quarter of the budget,
; which is how a stack that measures ~390 MB peak ends up OOM-killed at 512 MB.
;
; Everything except caddy binds to 127.0.0.1. Render picks the port to route to
; by scanning for a listener, so with the backend on 0.0.0.0:8080 it routed
; there and served Spring Boot's 404 at "/" instead of the SPA. Caddy must be
; the only thing listening on a public interface.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
user=tracer

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- tracers ---------------------------------------------------------------
; Started first so the backend's health probe finds them up. Each one already
; forks a child process per request and kills it on timeout; that per-run
; isolation is unchanged here. What this deployment cannot reproduce is the
; compose `internal: true` network -- see infra/render/README.md.

[program:tracer-python]
command=python -m uvicorn app.main:app --host 127.0.0.1 --port 8081 --workers 1
directory=/srv/tracer-python
environment=VIZ_DATA_DIR="/tmp/runs-python",MPLBACKEND="Agg",PYTHONUNBUFFERED="1"
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; Full JIT here on purpose: this process does the actual stepping work, so it is
; the one place the C1-only flag below would cost more than it saves.
;
; VIZ_DEBUGGEE_OPTS reaches the debuggee as JDI connector options. Do NOT be
; tempted to pass these through JAVA_TOOL_OPTIONS instead -- the JVM announces
; that variable on stderr, and the announcement lands in the traced program's
; captured stdout, so every Java trace would open with a "Picked up
; JAVA_TOOL_OPTIONS:" line the user did not write.
[program:tracer-java]
command=java -Xmx80m -XX:+UseSerialGC -jar /srv/tracer-java.jar
environment=PORT="8082",BIND_HOST="127.0.0.1",VIZ_DEBUGGEE_OPTS="-Xmx64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:tracer-node]
command=node --max-old-space-size=96 src/main.js
directory=/srv/tracer-node
environment=PORT="8083",BIND_HOST="127.0.0.1",NODE_ENV="production",NODE_PATH="/srv/tracer-node/node_modules",VIZ_PACKAGES_DIR="/srv/tracer-node/node_modules",VIZ_DATA_DIR="/tmp/runs-node"
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- orchestrator + edge ----------------------------------------------------

; Boots in ~85s on 0.1 vCPU instead of ~173s, measured. Spring Boot startup is
; class loading and bean wiring, which is exactly what C1-only JIT and lazy
; initialization make cheaper; steady state here is HTTP proxying and JSON, so
; giving up C2 costs this process little.
[program:backend]
command=java -Xmx128m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -jar /srv/backend.jar
environment=VISUALIZER_TRACER_PYTHON="http://127.0.0.1:8081",VISUALIZER_TRACER_JAVA="http://127.0.0.1:8082",VISUALIZER_TRACER_NODE="http://127.0.0.1:8083",SPRING_MAIN_LAZY_INITIALIZATION="true",SERVER_ADDRESS="127.0.0.1"
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /etc/caddy/Caddyfile
autorestart=true
priority=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
