# Keep the free Render instance from spinning down.
#
# Free instances sleep after 15 minutes without traffic and cost ~85 seconds to
# boot again on 0.1 vCPU, which every visitor would otherwise pay. The free
# allowance is 750 instance-hours a month and a month is about 730 hours, so
# staying up continuously fits -- but only for ONE free service. Running a
# second one alongside this will exhaust the quota partway through the month and
# suspend both.
#
# Set the RENDER_URL repository variable (Settings -> Secrets and variables ->
# Actions -> Variables) to your service URL, e.g. https://visualizer.onrender.com
# Without it this workflow no-ops rather than failing every 10 minutes.

name: keep-warm

on:
  schedule:
    # Every 10 minutes. GitHub runs scheduled jobs on a best-effort basis and
    # may delay them under load, so this is a floor, not a guarantee.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        env:
          RENDER_URL: ${{ vars.RENDER_URL }}
        run: |
          if [ -z "$RENDER_URL" ]; then
            echo "RENDER_URL is not set; nothing to ping."
            exit 0
          fi
          # A sleeping instance takes ~85s to wake, so allow well past that
          # before calling it a failure.
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
                   --max-time 180 "$RENDER_URL/api/health" || echo 000)
          echo "HTTP $code"
          cat /tmp/health.json 2>/dev/null || true
          echo
          [ "$code" = "200" ]
