server:
  port: 8080
  # Uploaded sample data can be sizable; the tracer caps it but the request must
  # be allowed through to be rejected with a clear message rather than a 413.
  tomcat:
    max-swallow-size: 12MB
  max-http-request-header-size: 16KB

spring:
  application:
    name: visualizer-backend
  mvc:
    problemdetails:
      enabled: true

visualizer:
  tracers:
    urls:
      python: ${VISUALIZER_TRACER_PYTHON:http://localhost:8081}
      java: ${VISUALIZER_TRACER_JAVA:http://localhost:8082}
      # One service traces both: it transpiles TypeScript and runs the result,
      # so the only difference between these two entries is what the tracer is
      # told the source is.
      javascript: ${VISUALIZER_TRACER_NODE:http://localhost:8083}
      typescript: ${VISUALIZER_TRACER_NODE:http://localhost:8083}
  groq:
    # Empty by default -> narration is disabled and the endpoint returns no
    # notes. Set GROQ_API_KEY in the environment to enable it.
    api-key: ${GROQ_API_KEY:}
    base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    max-steps-per-request: 45
    timeout-seconds: 25
  rate-limit:
    runs-per-minute: 20
    burst: 8
  auth:
    # Signs the access tokens this API issues and accepts. Unlike the blocks
    # above, nothing here has to be set for authentication to work: leave the
    # secret empty and one is generated on first boot and saved under data-dir,
    # so a fresh clone has working sign-up and restarts do not sign anyone out.
    #
    # Set it in production. A generated key lives in the container's filesystem
    # and a redeploy replaces that, which would sign every user out; an explicit
    # secret survives. Generate one with `openssl rand -base64 32`.
    secret: ${VISUALIZER_AUTH_SECRET:}
    # Holds users.json and the generated key. Must be writable by the process
    # user -- both Dockerfiles create it and chown it accordingly.
    data-dir: ${VISUALIZER_AUTH_DATA_DIR:data}
    token-ttl-minutes: ${VISUALIZER_AUTH_TOKEN_TTL_MINUTES:720}
  azure:
    storage:
      # Empty by default -> traces are cached in memory only, exactly as before
      # Azure existed, and a shared link stops resolving when the process
      # restarts. Set it and traces become durable. Carries the account key, so
      # it only ever comes from the environment.
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      container: ${AZURE_STORAGE_CONTAINER:traces}

management:
  endpoints:
    web:
      exposure:
        include: health
